<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>غرسة | من مكان مهمل إلى مكان يستحق الحياة</title>

    <!-- خط تجوال -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --green-dark: #123d2a;
            --green: #2f7d4b;
            --green-light: #5ca66e;
            --green-soft: #eaf6ed;
            --cream: #f8fbf7;
            --white: #ffffff;
            --text: #193126;
            --muted: #718078;
            --border: #e3ebe5;
            --danger: #c94a4a;
            --warning: #d79a25;
            --shadow: 0 15px 45px rgba(22, 61, 42, 0.10);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Tajawal", sans-serif;
            background: var(--cream);
            color: var(--text);
            overflow-x: hidden;
        }

        button,
        input,
        select,
        textarea {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* =========================
           LOADING
        ========================== */

        #loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--green-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity .6s ease, visibility .6s ease;
        }

        #loader.hide {
            opacity: 0;
            visibility: hidden;
        }

        .loader-content {
            text-align: center;
            color: white;
            animation: loaderUp 1s ease;
        }

        .loader-logo {
            width: 82px;
            height: 82px;
            margin: auto auto 18px;
            border: 1px solid rgba(255,255,255,.3);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            background: rgba(255,255,255,.08);
        }

        .loader-content h1 {
            font-size: 34px;
            margin-bottom: 7px;
        }

        .loader-content p {
            color: rgba(255,255,255,.7);
        }

        @keyframes loaderUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           HEADER
        ========================== */

        header {
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            z-index: 1000;
            padding: 17px 5%;
            transition: .3s ease;
        }

        header.scrolled {
            background: rgba(255,255,255,.93);
            backdrop-filter: blur(15px);
            box-shadow: 0 5px 25px rgba(0,0,0,.06);
            padding-top: 11px;
            padding-bottom: 11px;
        }

        .navbar {
            max-width: 1250px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 11px;
            font-weight: 900;
            font-size: 25px;
            color: white;
        }

        header.scrolled .logo {
            color: var(--green-dark);
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            background: rgba(255,255,255,.15);
            font-size: 21px;
        }

        header.scrolled .logo-icon {
            background: var(--green-soft);
        }

        .desktop-links {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .desktop-links a {
            padding: 10px 15px;
            color: rgba(255,255,255,.85);
            border-radius: 12px;
            font-size: 14px;
            transition: .25s;
        }

        header.scrolled .desktop-links a {
            color: var(--text);
        }

        .desktop-links a:hover {
            background: rgba(255,255,255,.12);
        }

        header.scrolled .desktop-links a:hover {
            background: var(--green-soft);
            color: var(--green);
        }

        .menu-btn {
            width: 45px;
            height: 45px;
            border: 0;
            background: rgba(255,255,255,.12);
            color: white;
            border-radius: 13px;
            font-size: 19px;
            display: none;
        }

        header.scrolled .menu-btn {
            color: var(--green-dark);
            background: var(--green-soft);
        }

        /* =========================
           SIDE MENU
        ========================== */

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.42);
            z-index: 1500;
            opacity: 0;
            visibility: hidden;
            transition: .3s;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .side-menu {
            position: fixed;
            top: 0;
            right: -340px;
            width: min(330px, 88%);
            height: 100vh;
            background: white;
            z-index: 1600;
            padding: 28px 22px;
            transition: .4s ease;
            box-shadow: -15px 0 40px rgba(0,0,0,.12);
        }

        .side-menu.active {
            right: 0;
        }

        .side-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 22px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 18px;
        }

        .side-head strong {
            font-size: 22px;
            color: var(--green-dark);
        }

        .close-menu {
            border: 0;
            background: var(--green-soft);
            color: var(--green);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            font-size: 18px;
        }

        .side-menu nav a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 15px;
            border-radius: 13px;
            margin-bottom: 6px;
            color: var(--text);
            transition: .25s;
        }

        .side-menu nav a:hover {
            background: var(--green-soft);
            color: var(--green);
            transform: translateX(-4px);
        }

        .side-menu nav i {
            width: 22px;
            color: var(--green);
        }

        /* =========================
           HERO
        ========================== */

        .hero {
            min-height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            overflow: hidden;
            background:
                radial-gradient(circle at 15% 20%, rgba(95,170,113,.18), transparent 25%),
                radial-gradient(circle at 85% 70%, rgba(95,170,113,.13), transparent 28%),
                var(--green-dark);
            color: white;
            padding: 120px 5% 80px;
        }

        .hero::before {
            content: "";
            position: absolute;
            width: 520px;
            height: 520px;
            border: 1px solid rgba(255,255,255,.06);
            border-radius: 50%;
            left: -220px;
            bottom: -250px;
        }

        .hero-container {
            max-width: 1250px;
            width: 100%;
            margin: auto;
            display: grid;
            grid-template-columns: 1.1fr .9fr;
            gap: 70px;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        .hero-text {
            animation: fadeRight 1s ease .2s both;
        }

        @keyframes fadeRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 8px 14px;
            border-radius: 100px;
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.1);
            color: #d6efdc;
            font-size: 13px;
            margin-bottom: 22px;
        }

        .hero h1 {
            font-size: clamp(45px, 6vw, 76px);
            line-height: 1.05;
            margin-bottom: 22px;
            font-weight: 900;
        }

        .hero h1 span {
            color: #8bd59c;
        }

        .hero-description {
            color: rgba(255,255,255,.72);
            max-width: 650px;
            font-size: 18px;
            line-height: 2;
            margin-bottom: 32px;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .btn {
            border: 0;
            padding: 14px 22px;
            border-radius: 14px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 9px;
            font-weight: 700;
            transition: .25s;
            font-size: 14px;
        }

        .btn-primary {
            background: white;
            color: var(--green-dark);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(0,0,0,.18);
        }

        .btn-green {
            background: var(--green);
            color: white;
        }

        .btn-green:hover {
            background: #26673e;
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255,255,255,.2);
            color: white;
        }

        .btn-outline:hover {
            background: rgba(255,255,255,.08);
        }

        .hero-visual {
            display: flex;
            justify-content: center;
            animation: fadeLeft 1s ease .4s both;
        }

        @keyframes fadeLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .tree-card {
            width: min(390px, 100%);
            aspect-ratio: .88;
            border-radius: 45px;
            background:
                linear-gradient(145deg, rgba(255,255,255,.12), rgba(255,255,255,.035));
            border: 1px solid rgba(255,255,255,.13);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .tree-card::before {
            content: "";
            position: absolute;
            width: 290px;
            height: 290px;
            background: rgba(101,181,119,.13);
            border-radius: 50%;
            top: -80px;
            left: -70px;
        }

        .big-tree {
            position: relative;
            z-index: 2;
            text-align: center;
        }

      .big-tree {
      color: #2e8b57;
    position: relative;
    z-index: 2;
    text-align: center;
    transform: translateY(-50px);
}

        .tree-card-text {
            position: absolute;
            bottom: 30px;
            right: 30px;
            left: 30px;
            padding: 17px;
            background: rgba(0,0,0,.14);
            border-radius: 18px;
            backdrop-filter: blur(5px);
        }

        .tree-card-text strong {
            display: block;
            font-size: 17px;
            margin-bottom: 4px;
        }

        .tree-card-text small {
            color: rgba(255,255,255,.63);
        }

        /* =========================
           SECTION
        ========================== */

        .section {
            padding: 100px 5%;
        }

        .section-head {
            text-align: center;
            max-width: 720px;
            margin: 0 auto 50px;
        }

        .section-label {
            display: inline-block;
            color: var(--green);
            background: var(--green-soft);
            padding: 7px 13px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 13px;
        }

        .section-head h2 {
            font-size: clamp(30px, 4vw, 43px);
            margin-bottom: 13px;
            color: var(--green-dark);
        }

        .section-head p {
            color: var(--muted);
            line-height: 1.9;
        }

        /* =========================
           CARDS
        ========================== */

        .cards {
            max-width: 1150px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .action-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 25px;
            padding: 30px;
            cursor: pointer;
            transition: .3s;
            box-shadow: 0 5px 20px rgba(20,50,30,.03);
            position: relative;
            overflow: hidden;
        }

        .action-card::after {
            content: "";
            position: absolute;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: var(--green-soft);
            left: -30px;
            bottom: -40px;
            transition: .3s;
        }

        .action-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow);
            border-color: #cce2d1;
        }

        .action-card:hover::after {
            transform: scale(1.4);
        }

        .card-icon {
            width: 60px;
            height: 60px;
            border-radius: 18px;
            background: var(--green-soft);
            color: var(--green);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
            margin-bottom: 24px;
            position: relative;
            z-index: 2;
        }

        .action-card h3 {
            font-size: 23px;
            margin-bottom: 12px;
            color: var(--green-dark);
            position: relative;
            z-index: 2;
        }

        .action-card p {
            color: var(--muted);
            line-height: 1.9;
            font-size: 14px;
            position: relative;
            z-index: 2;
        }

        .card-arrow {
            display: flex;
            justify-content: flex-start;
            margin-top: 24px;
            color: var(--green);
            position: relative;
            z-index: 2;
        }

        /* =========================
           ABOUT
        ========================== */

        .about {
            background: white;
        }

        .about-container {
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: .85fr 1.15fr;
            gap: 65px;
            align-items: center;
        }

        .about-art {
            min-height: 360px;
            border-radius: 35px;
            background: var(--green-soft);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .about-art::before,
        .about-art::after {
            content: "";
            position: absolute;
            border: 1px solid rgba(47,125,75,.15);
            border-radius: 50%;
        }

        .about-art::before {
            width: 290px;
            height: 290px;
        }

        .about-art::after {
            width: 410px;
            height: 410px;
        }

        .about-art i {
            font-size: 135px;
            color: var(--green);
            position: relative;
            z-index: 2;
        }

        .about-content h2 {
            font-size: 39px;
            color: var(--green-dark);
            margin-bottom: 18px;
        }

        .about-content p {
            color: var(--muted);
            line-height: 2;
            margin-bottom: 15px;
        }

        .goals {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 25px;
        }

        .goal {
            background: var(--cream);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 14px;
        }

        .goal i {
            color: var(--green);
        }

        /* =========================
           IMPACT
        ========================== */

        .impact {
            background: var(--green-dark);
            color: white;
        }

        .impact .section-head h2 {
            color: white;
        }

        .impact .section-head p {
            color: rgba(255,255,255,.62);
        }

        .stats {
            max-width: 1000px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .stat {
            border: 1px solid rgba(255,255,255,.1);
            background: rgba(255,255,255,.045);
            border-radius: 22px;
            padding: 28px;
            text-align: center;
        }

        .stat i {
            color: #8bd59c;
            font-size: 27px;
            margin-bottom: 14px;
        }

        .stat strong {
            display: block;
            font-size: 35px;
            margin-bottom: 4px;
        }

        .stat span {
            color: rgba(255,255,255,.58);
            font-size: 13px;
        }

        /* =========================
           MODAL
        ========================== */

        .modal {
            position: fixed;
            inset: 0;
            z-index: 3000;
            background: rgba(5,20,12,.62);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 18px;
            opacity: 0;
            visibility: hidden;
            transition: .3s;
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            background: white;
            width: min(650px, 100%);
            max-height: 92vh;
            overflow-y: auto;
            border-radius: 28px;
            padding: 30px;
            transform: translateY(25px) scale(.97);
            transition: .3s;
        }

        .modal.active .modal-box {
            transform: translateY(0) scale(1);
        }
